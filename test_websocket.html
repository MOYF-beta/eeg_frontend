<!DOCTYPE html>
<html>
<head>
    <title>WebSocket 测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .connecting { background-color: #fff3cd; color: #856404; }
        .error { background-color: #f8d7da; color: #721c24; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee; }
        .timestamp { color: #666; font-size: 0.8em; }
    </style>
</head>
<body>
    <h1>WebSocket 连接测试</h1>
    
    <div id="status" class="status disconnected">状态: 未连接</div>
    
    <button onclick="connectWebSocket()">连接 WebSocket</button>
    <button onclick="disconnectWebSocket()" disabled id="disconnectBtn">断开连接</button>
    <button onclick="sendPing()" disabled id="pingBtn">发送 Ping</button>
    
    <h3>消息日志:</h3>
    <div id="messages"></div>
    
    <script>
        let ws = null;
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const pingBtn = document.getElementById('pingBtn');
        
        function updateStatus(status, message) {
            statusEl.className = 'status ' + status;
            statusEl.textContent = '状态: ' + message;
            console.log('WebSocket状态:', status, message);
        }
        
        function addMessage(type, data) {
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            
            const timestamp = new Date().toLocaleTimeString();
            const timestampEl = document.createElement('span');
            timestampEl.className = 'timestamp';
            timestampEl.textContent = '[' + timestamp + '] ';
            
            const contentEl = document.createElement('span');
            
            if (type === 'send') {
                contentEl.textContent = '发送: ' + JSON.stringify(data);
                contentEl.style.color = '#007bff';
            } else if (type === 'receive') {
                contentEl.textContent = '接收: ' + JSON.stringify(data);
                contentEl.style.color = '#28a745';
            } else if (type === 'error') {
                contentEl.textContent = '错误: ' + data;
                contentEl.style.color = '#dc3545';
            } else if (type === 'info') {
                contentEl.textContent = '信息: ' + data;
                contentEl.style.color = '#6c757d';
            }
            
            messageEl.appendChild(timestampEl);
            messageEl.appendChild(contentEl);
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
                addMessage('info', 'WebSocket 已经连接或正在连接');
                return;
            }
            
            // 使用与前端相同的WebSocket URL
            const wsUrl = 'ws://' + window.location.hostname + ':8000/ws/eeg/';
            updateStatus('connecting', '连接中...');
            addMessage('info', '正在连接到: ' + wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                updateStatus('connected', '已连接');
                addMessage('info', 'WebSocket 连接成功');
                disconnectBtn.disabled = false;
                pingBtn.disabled = false;
                
                // 发送订阅消息（模拟前端行为）
                setTimeout(() => {
                    const subscribeMsg = {
                        type: 'subscribe',
                        nodeIds: ['test-osc-001']
                    };
                    ws.send(JSON.stringify(subscribeMsg));
                    addMessage('send', subscribeMsg);
                }, 1000);
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    addMessage('receive', data);
                    
                    // 如果是数据包，显示详细信息
                    if (data.type === 'data') {
                        console.log('收到数据包:', data);
                    }
                } catch (e) {
                    addMessage('receive', event.data);
                }
            };
            
            ws.onerror = function(error) {
                updateStatus('error', '连接错误');
                addMessage('error', 'WebSocket 错误: ' + JSON.stringify(error));
                console.error('WebSocket错误:', error);
            };
            
            ws.onclose = function(event) {
                updateStatus('disconnected', '已断开连接');
                addMessage('info', 'WebSocket 连接关闭，代码: ' + event.code + ', 原因: ' + event.reason);
                disconnectBtn.disabled = true;
                pingBtn.disabled = true;
                ws = null;
            };
        }
        
        function disconnectWebSocket() {
            if (ws) {
                // 发送取消订阅消息
                const unsubscribeMsg = {
                    type: 'unsubscribe'
                };
                ws.send(JSON.stringify(unsubscribeMsg));
                addMessage('send', unsubscribeMsg);
                
                // 关闭连接
                ws.close();
                ws = null;
            }
        }
        
        function sendPing() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const pingMsg = {
                    type: 'ping'
                };
                ws.send(JSON.stringify(pingMsg));
                addMessage('send', pingMsg);
            }
        }
        
        // 页面加载时显示当前主机信息
        window.onload = function() {
            addMessage('info', '当前主机: ' + window.location.hostname);
            addMessage('info', 'WebSocket URL: ws://' + window.location.hostname + ':8000/ws/eeg/');
        };
    </script>
</body>
</html>
