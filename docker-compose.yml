version: '3.8'

services:
  # 后端服务 - Django + Channels (WebSocket)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eeg_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=eeg_backend.settings
    networks:
      - eeg_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 前端服务 - Vue 3 + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eeg_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - eeg_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  eeg_network:
    driver: bridge
